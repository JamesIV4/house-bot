name: house-bot-navigation

services:
  navigation:
    build:
      context: ..
      dockerfile: navigation/Dockerfile
      args:
        VIZANTI_COMMIT: ab43643b2e12b6b7b66f0d53d6ba2ef3eacd3b42
    image: house-bot-navigation:jazzy
    init: true
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    ports:
      - "${HOUSE_BOT_UI_PORT:-5000}:5000"
      - "${HOUSE_BOT_ROSBRIDGE_PORT:-5001}:5001"
    volumes:
      - "${HOUSE_BOT_BASE_CALIBRATION:-../ros_ws/src/house_bot_navigation/config/base-calibration-placeholder.yaml}:/opt/house_bot/config/base_calibration.yaml:ro"
    command:
      - ros2
      - launch
      - house_bot_navigation
      - mock_navigation.launch.py
      - ui_port:=5000
      - rosbridge_port:=5001
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s
